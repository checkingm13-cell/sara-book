<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1628" />
      <stop offset="60%" stop-color="#0D3B66" />
      <stop offset="100%" stop-color="#1658b3" />
    </linearGradient>
    <linearGradient id="spine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.45" />
      <stop offset="30%" stop-color="#000000" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="450" fill="url(#grad)" />
  
  <!-- Subtle Grid Accent -->
  <path d="M 0,90 L 300,90 M 0,380 L 300,380" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
  
  <!-- Header Tag -->
  <rect x="25" y="35" width="120" height="20" rx="4" fill="#FFAE00" />
  <text x="32" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" fill="#0A1628" letter-spacing="1">ACADEMIC MONOGRAPH</text>
  
  <!-- Center Book Icon -->
  <g transform="translate(115, 170) scale(1.5)" fill="none" stroke="#FFAE00" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z" />
    <path d="M6 6h10" />
    <path d="M6 10h10" />
  </g>
  
  <!-- Title / Publisher Text -->
  <text x="150" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">SARA BOOK PUBLICATION</text>
  <text x="150" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#93c5fd" text-anchor="middle" font-family="monospace">UGC VALID ISBN ALLOCATION</text>
  
  <!-- Footer Bar -->
  <rect x="25" y="400" width="250" height="2" fill="#FFAE00" fill-opacity="0.6" />
  <text x="150" y="425" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">PEER-REVIEWED RESEARCH DIVISION</text>

  <!-- Left Spine Shadow Simulation -->
  <rect x="0" y="0" width="18" height="450" fill="url(#spine)" />
</svg>
